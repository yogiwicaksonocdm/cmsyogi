<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Simple CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-3xl mx-auto p-6">

        <!-- ======== Tampilan Login ======== -->
        <section id="view-login" class="hidden max-w-sm mx-auto mt-20 bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h1 class="text-xl font-bold text-gray-800 mb-1">Login Admin</h1>
            <p class="text-sm text-gray-500 mb-4">Masukkan password untuk mengelola konten.</p>
            <form id="login-form" class="space-y-4">
                <input type="password" id="password" required placeholder="Password admin"
                    class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Masuk</button>
            </form>
            <p id="login-error" class="hidden text-sm text-red-500 mt-3"></p>
            <p class="text-xs text-center mt-4"><a href="/" class="text-gray-400 hover:text-blue-600">&larr; Ke area publik</a></p>
        </section>

        <!-- ======== Tampilan Dashboard ======== -->
        <section id="view-dash" class="hidden">
            <header class="flex justify-between items-center mb-8 border-b pb-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Area Admin</h1>
                    <p class="text-sm text-gray-500">Kelola seluruh konten (termasuk draft)</p>
                </div>
                <div class="flex gap-2 items-center">
                    <a href="/" class="text-blue-600 hover:underline text-sm">Lihat Publik</a>
                    <button onclick="logout()" class="text-sm bg-gray-200 text-gray-700 px-3 py-1.5 rounded hover:bg-gray-300">Keluar</button>
                </div>
            </header>

            <button onclick="openForm()" class="mb-5 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">+ Tambah Konten</button>

            <div id="admin-loading" class="text-center py-10 text-gray-500">Memuat data...</div>
            <div id="admin-list" class="grid gap-4"></div>
        </section>

        <!-- ======== Tampilan Form Tambah/Edit ======== -->
        <section id="view-form" class="hidden max-w-2xl mx-auto">
            <header class="mb-6 border-b pb-4 flex justify-between items-center">
                <h1 id="form-title" class="text-2xl font-bold text-gray-800">Tambah Konten</h1>
                <a onclick="openList()" class="text-gray-500 hover:text-blue-600 cursor-pointer">&larr; Kembali</a>
            </header>

            <form id="cms-form" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
                <input type="hidden" id="post-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                    <input type="text" id="title" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Penulis</label>
                    <input type="text" id="author" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" value="Admin">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Konten</label>
                    <textarea id="content" rows="6" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="status" class="w-full border rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="published">Published - tampil di halaman publik</option>
                        <option value="draft">Draft - hanya terlihat di admin</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Simpan Konten</button>
            </form>
        </section>
    </div>

    <script>
        const TOKEN_KEY = 'cms_admin_token';

        function getToken() { return localStorage.getItem(TOKEN_KEY); }
        function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
        function clearToken() { localStorage.removeItem(TOKEN_KEY); }

        function show(sectionId) {
            ['view-login', 'view-dash', 'view-form'].forEach(id => {
                document.getElementById(id).classList.toggle('hidden', id !== sectionId);
            });
        }

  // ===== Session check =====
        async function boot() {
            if (!getToken()) { show('view-login'); return; }
            try {
                const res = await authFetch('/api/admin/check');
                if (res.status === 401) { handleUnauthorized(); return; }
                openList();
            } catch {
                show('view-login');
            }
        }

        function handleUnauthorized() {
            clearToken();
            show('view-login');
        }

        function authFetch(url, options = {}) {
            options.headers = Object.assign({ 'Authorization': 'Bearer ' + getToken() }, options.headers);
            if (options.body && !options.headers['Content-Type']) options.headers['Content-Type'] = 'application/json';
            return fetch(url, options);
        }

        // ===== Login =====
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('login-error');
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value })
                });
                const result = await res.json();
                if (res.status === 401 || !result.success) {
                    errEl.innerText = result.message || 'Password salah';
                    errEl.classList.remove('hidden');
                    return;
                }
                setToken(result.token);
                document.getElementById('password').value = '';
                errEl.classList.add('hidden');
                openList();
            } catch {
                errEl.innerText = 'Terjadi kesalahan jaringan.';
                errEl.classList.remove('hidden');
            }
        });

        function logout() {
            clearToken();
            document.getElementById('admin-list').innerHTML = '';
            show('view-login');
        }

        // ===== Dashboard =====
        function fmtDate(ts) {
            if (!ts) return '';
            const d = ts._seconds ? new Date(ts._seconds * 1000) : new Date(ts);
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        async function openList() {
            show('view-dash');
            document.getElementById('admin-loading').style.display = 'block';
            document.getElementById('admin-list').innerHTML = '';
            try {
                const res = await authFetch('/api/admin/posts');
                if (res.status === 401) { handleUnauthorized(); return; }
                const result = await res.json();
                if (!result.success) throw new Error(result.error);

                const container = document.getElementById('admin-list');
                if (result.data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-6">Belum ada konten. Klik "+ Tambah Konten".</p>';
                    return;
                }

                container.innerHTML = result.data.map(post => {
                    const isDraft = post.status === 'draft';
                    return `
                        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-start">
                            <div class="min-w-0">
                                <h2 class="text-lg font-semibold text-gray-800">${post.title}</h2>
                                <p class="text-xs text-gray-400 mt-1">
                                    Oleh: ${post.author || 'Admin'}${fmtDate(post.createdAt) ? ' &bull; ' + fmtDate(post.createdAt) : ''}
                                </p>
                                <span class="inline-block mt-2 px-2 py-0.5 rounded text-xs font-medium
                                    ${isDraft ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}">
                                    ${isDraft ? 'Draft' : 'Published'}
                                </span>
                            </div>
                            <div class="flex gap-2 shrink-0 ml-4">
                                <button onclick="${isDraft ? 'publishPost' : 'unpublishPost'}('${post.id}')" class="bg-sky-500 text-white px-3 py-1.5 rounded text-sm hover:bg-sky-600">${isDraft ? 'Publish' : 'Unpublish'}</button>
                                <button onclick="openEdit('${post.id}')" class="bg-amber-500 text-white px-3 py-1.5 rounded text-sm hover:bg-amber-600">Edit</button>
                                <button onclick="deletePost('${post.id}')" class="bg-red-500 text-white px-3 py-1.5 rounded text-sm hover:bg-red-600">Hapus</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('admin-list').innerHTML =
                    '<p class="text-red-500 text-center py-6">Gagal memuat data admin.</p>';
            } finally {
                document.getElementById('admin-loading').style.display = 'none';
            }
        }

        // Publish/Unpublish: ambil data admin lalu PUT dengan status baru
        async function changeStatus(postId, status) {
            try {
                const res = await authFetch(`/api/admin/posts/${postId}`);
                if (res.status === 401) { handleUnauthorized(); return; }
                const result = await res.json();
                if (!result.success) { alert('Gagal mengambil data konten.'); return; }
                const p = result.data;
                const res2 = await authFetch(`/api/posts/${postId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ title: p.title, content: p.content, author: p.author, status })
                });
                if (res2.status === 401) { handleUnauthorized(); return; }
            } catch { alert('Terjadi kesalahan jaringan.'); }
            openList();
        }

        function publishPost(id) {
            if (!confirm('Publish konten ini?')) return;
            changeStatus(id, 'published');
        }

        function unpublishPost(id) {
            if (!confirm('Jadikan draft agar tidak tampil di publik?')) return;
            changeStatus(id, 'draft');
        }

        async function deletePost(id) {
            if (!confirm('Yakin ingin menghapus konten ini?')) return;
            try {
                const res = await authFetch(`/api/posts/${id}`, { method: 'DELETE' });
                if (res.status === 401) { handleUnauthorized(); return; }
                openList();
            } catch { alert('Terjadi kesalahan jaringan.'); }
        }

        // ===== Form =====
        function openForm() {
            document.getElementById('cms-form').reset();
            document.getElementById('post-id').value = '';
            document.getElementById('author').value = 'Admin';
            document.getElementById('status').value = 'published';
            document.getElementById('form-title').innerText = 'Tambah Konten';
            document.getElementById('submit-btn').innerText = 'Simpan Konten';
            show('view-form');
        }

        async function openEdit(id) {
            try {
                const res = await authFetch(`/api/admin/posts/${id}`);
                if (res.status === 401) { handleUnauthorized(); return; }
                const result = await res.json();
                if (!result.success) { alert('Gagal mengambil data.'); return; }
                const p = result.data;
                document.getElementById('post-id').value = id;
                document.getElementById('title').value = p.title || '';
                document.getElementById('author').value = p.author || 'Admin';
                document.getElementById('content').value = p.content || '';
                document.getElementById('status').value = p.status === 'draft' ? 'draft' : 'published';
                document.getElementById('form-title').innerText = 'Edit Konten';
                document.getElementById('submit-btn').innerText = 'Perbarui Konten';
                show('view-form');
            } catch { alert('Terjadi kesalahan jaringan.'); }
        }

        document.getElementById('cms-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('post-id').value;
            const body = JSON.stringify({
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                content: document.getElementById('content').value,
                status: document.getElementById('status').value
            });
            try {
                const res = await authFetch(id ? `/api/posts/${id}` : '/api/posts', {
                    method: id ? 'PUT' : 'POST',
                    body
                });
                if (res.status === 401) { handleUnauthorized(); return; }
                const result = await res.json();
                if (result.success) openList();
                else alert('Gagal menyimpan: ' + (result.error || result.message));
            } catch { alert('Terjadi kesalahan jaringan.'); }
        });

        boot();
    </script>
</body>
</html>

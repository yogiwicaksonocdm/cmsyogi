<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Simple CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-3xl mx-auto p-6">
        <header class="flex justify-between items-center mb-8 border-b pb-4">
            <a href="/" class="text-2xl font-bold text-gray-800 hover:text-blue-700">Simple CMS</a>
            <a href="/admin" class="text-sm text-gray-500 hover:text-blue-600 transition">Login Admin</a>
        </header>

        <div id="loading" class="text-center py-10 text-gray-500">Memuat data...</div>

        <main id="post-list" class="grid gap-4"></main>

        <footer class="mt-10 pt-4 border-t text-xs text-gray-400 text-center">
            Area pengelolaan konten tersedia di <a href="/admin" class="text-blue-500 hover:underline">halaman admin</a>.
        </footer>
    </div>

    <script>
        function renderPost(post) {
            const date = post.createdAt
                ? new Date(post.createdAt._seconds ? post.createdAt._seconds * 1000 : post.createdAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' })
                : '';
            return `
                <article class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <a href="/post.html?id=${post.id}" class="block">
                        <h2 class="text-xl font-semibold text-gray-800 hover:text-blue-700 transition">${post.title}</h2>
                        <p class="text-xs text-gray-400 mt-1">
                            Oleh: ${post.author || 'Admin'}${date ? ' &bull; ' + date : ''}
                        </p>
                        <p class="text-gray-600 mt-3 line-clamp-3">${post.content}</p>
                        <p class="text-blue-600 text-sm mt-3">Baca selengkapnya &rarr;</p>
                    </a>
                </article>
            `;
        }

        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts');
                const result = await response.json();
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('post-list');

                if (!result.success) throw new Error(result.error);
                if (result.data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-6">Belum ada konten yang dipublish.</p>';
                    return;
                }
                container.innerHTML = result.data.map(renderPost).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('post-list').innerHTML =
                    '<p class="text-red-500 text-center py-6">Gagal memuat data dari server.</p>';
            }
        }

        fetchPosts();
    </script>
</body>
</html>

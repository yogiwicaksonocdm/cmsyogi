<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Konten - Simple CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-2xl mx-auto p-6">
        <header class="mb-6 border-b pb-4 flex justify-between items-center">
            <h1 id="form-title" class="text-2xl font-bold text-gray-800">Tambah Konten Baru</h1>
            <a href="/" class="text-blue-600 hover:underline">&larr; Kembali</a>
        </header>

        <form id="cms-form" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
            <input type="hidden" id="post-id">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                <input type="text" id="title" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Penulis</label>
                <input type="text" id="author" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" value="Admin">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Konten</label>
                <textarea id="content" rows="6" required class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Simpan Konten</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (postId) {
            document.getElementById('form-title').innerText = 'Edit Konten';
            document.getElementById('submit-btn').innerText = 'Perbarui Konten';
            loadPostData(postId);
        }

        async function loadPostData(id) {
            try {
                const res = await fetch(`/api/posts/${id}`);
                const result = await res.json();
                if (result.success) {
                    document.getElementById('post-id').value = result.data.id;
                    document.getElementById('title').value = result.data.title;
                    document.getElementById('author').value = result.data.author || 'Admin';
                    document.getElementById('content').value = result.data.content;
                }
            } catch (err) {
                alert('Gagal mengambil data untuk diedit.');
            }
        }

        document.getElementById('cms-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('post-id').value;
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const content = document.getElementById('content').value;

            const endpoint = id ? `/api/posts/${id}` : '/api/posts';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, author, content })
                });
                const result = await res.json();
                if (result.success) {
                    window.location.href = '/';
                } else {
                    alert('Gagal menyimpan: ' + result.error);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan.');
            }
        });
    </script>
</body>
</html>
